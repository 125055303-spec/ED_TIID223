<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi información personal</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #243047;
      background: linear-gradient(135deg, #e8f0ff, #f7eaff);
    }
    main {
      width: min(100%, 680px);
      padding: 36px;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 14px 40px #34466a22;
    }
    .avatar {
      width: 88px;
      height: 88px;
      display: grid;
      place-items: center;
      margin-bottom: 20px;
      border-radius: 50%;
      color: #fff;
      background: #6655c7;
      font-size: 36px;
    }
    h1 { margin: 0 0 8px; font-size: 2rem; }
    .intro { margin: 0; color: #68738a; line-height: 1.6; }
    h2 { margin: 28px 0 14px; font-size: 1.15rem; }
    dl { display: grid; grid-template-columns: 1fr 2fr; gap: 12px 20px; margin: 0; }
    dt { color: #68738a; }
    dd { margin: 0; font-weight: 600; }
    a { color: #5544b4; text-decoration: none; }
    a:hover { text-decoration: underline; }
    @media (max-width: 480px) {
      main { padding: 26px 22px; }
      dl { grid-template-columns: 1fr; gap: 5px; }
      dd { margin-bottom: 10px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="avatar" aria-hidden="true">👤</div>
    <h1>Mi información personal</h1>
    <p class="intro">¡Hola! Este es un espacio para presentarme y compartir un poco sobre mí.</p>
    <section aria-labelledby="sobre-mi">
      <h2 id="sobre-mi">Sobre mí</h2>
      <dl>
        <dt>Nombre</dt><dd>Tu nombre aquí</dd>
        <dt>Ocupación</dt><dd>Tu ocupación o profesión</dd>
        <dt>Ubicación</dt><dd>Tu ciudad, país</dd>
        <dt>Intereses</dt><dd>Tus pasatiempos e intereses</dd>
        <dt>Correo</dt><dd><a href="mailto:tu-correo@ejemplo.com">tu-correo@ejemplo.com</a></dd>
      </dl>
    </section>
  </main>
</body>
</html>
